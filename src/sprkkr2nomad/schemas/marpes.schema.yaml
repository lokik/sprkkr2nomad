schema_package: sprkkr_marpes
sections:
  SprkkrMarpesArpesControl:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'CONTROL'
    quantities:
      DATASET:
        type:
          type_kind: string
      ADSI:
        type:
          type_kind: string
        enum:
        - ARPES
        default: ARPES
      POTFIL:
        type:
          type_kind: string
      KRWS:
        type:
          type_kind: int
        min_value: 0
        max_value: 1
        default: 1
      KRMT:
        type:
          type_kind: string
        enum:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        description: "Possible values:\n  0         RMT is taken from the potential\
          \ file\n  1         RMT = min( x*RWS )\n  2         RMT = min( d_ij / 2\
          \ )\n  3         RMT from atomic charge density (=> KRWS=1)\n  4       \
          \  RMT from atomic Hartree potential (=> KRWS=1)\n  5         RMT from total\
          \ atomic potential (=> KRWS=1)\n  6         take average of 3 and 4 (=>\
          \ KRWS=1)"
      PRINT:
        type:
          type_kind: int
        min_value: 0
        max_value: 5
        default: 0
      NONMAG:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
      NOHFF:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
      NOSYM:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
  SprkkrMarpesArpesTau:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'TAU'
    quantities:
      BZINT:
        type:
          type_kind: string
        enum:
        - POINTS
        - WEYL
        - CLUSTER
        description: 'The Weyl method (BZINT=WEYL) is a point sampling method using
          more or less ran-

          dom points. The number of k-points used for the integration varies quadratically
          be-

          tween 0.0 and ImE according to the imaginary part of the energy.


          The special point method (BZINT=POINTS) uses a regular k-point grid with
          NKTAB

          points. It is the standard method and gives a good compromise concerning
          accuracy

          and efficiency. For BZINT=POINTS the parameter NKTAB will be adjusted to
          allow a

          regular mesh.'
      NKTAB:
        type:
          type_kind: int
        default: 555
        description: For 2D problem, it serves only as default value for NKTABxD.
      NKTAB2D:
        type:
          type_kind: int
        description: If it is not specified, NKTAB is used.
      NKTAB3D:
        type:
          type_kind: int
        description: If it is not specified, NKTAB is used
      NKMIN:
        type:
          type_kind: int
        default: 300
      NKMAX:
        type:
          type_kind: int
        default: 500
      CLUSTER:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
        description: "Cluster type calculation calculate \u03C4 by inverting the real\
          \ space KKR matrix. Specify cluster center using IQCNTR or ITCNTR and its\
          \ size using NSHLCLU or CLURAD."
      NSHLCLU:
        type:
          type_kind: int
      CLURAD:
        type:
          type_kind: float
      IQCNTR:
        type:
          type_kind: string
      ITCNTR:
        type:
          type_kind: string
      NLOUT:
        type:
          type_kind: int
        default: 3
      MOL:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
      KKRMODE:
        type:
          type_kind: string
        enum:
        - STANDARD-KKR
        - TB-KKR
        - LAYER-KKR
  SprkkrMarpesArpesEnergy:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'ENERGY'
    quantities:
      GRID:
        type:
          type_kind: int
        repeated: true
        default:
        - 1
        description: "0    only real energies -- Gauss integration mesh\n   1    only\
          \ real energies -- equidistant path\n   2    rectangular complex path\n\
          \   3    straight complex path parallel to real axis\n   4    rectangular\
          \ complex grid, return to real axis on log scale\n   5    arc in the complex\
          \ plain\n   6    standard X-ray mesh from E_Fermi to 3.5 Ry\n   7    X-ray\
          \ mesh\n   8    arc in the complex plane (logarithim)\n   9    arc in the\
          \ complex plane (Akai's scheme)\n  10    ellipse in the complex plain\n\
          \  11    semi circle (5) plus straight line (3)"
      NE:
        type:
          type_kind: int
        repeated: true
        default:
        - 300
      ImE:
        type:
          type_kind: float
        unit: Ry
        allowed_units:
        - Ry
        - eV
        default: 0.0
      EMIN:
        type:
          type_kind: float
      EMINEV:
        type:
          type_kind: float
        default: -8.0
      EMAX:
        type:
          type_kind: float
      EMAXEV:
        type:
          type_kind: float
        default: 5.0
      EWORK_EV:
        type:
          type_kind: float
        default: 4.2
      IMV_INI_EV:
        type:
          type_kind: float
        default: 0.05
      IMV_FIN_EV:
        type:
          type_kind: float
        default: 2.0
  SprkkrMarpesArpesSites:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'SITES'
    quantities:
      NL:
        type:
          type_kind: int
        repeated: true
        default:
        - 4
        description: 'The KKR-method is a minimum basis set method. This means that
          the angular-momentum

          expansion can be chosen according to the atomic properties of the atomic
          types. For tran-

          sition metals it is therefore normally sufficient to have a maximum l-value
          of 2 (NL = 3).

          For systems with many atoms per unit cell it is in principle possible to
          set the l-expansion

          according to the atom types on the lattice sites. For US having the NaCl-structure
          one could

          choose NL = 4 for the U-site and NL = 2 for the S-site. At the moment this
          possibility, that

          would save storage and computer time, is not supported by all subroutines.
          For this rea-

          son a common l-expansion cutoff is used, that is fixed by the highest that
          occurs. For US

          this implies that NL = 4 is used for all sites.'
  SprkkrMarpesArpesTask:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'TASK'
    quantities:
      TASK:
        type:
          type_kind: string
        enum:
        - ARPES
        - AIPES
        - SPLEED
        - BAND
        default: ARPES
        description: "Possible values:\n  ARPES     Angle resolved photoemission spectroscopy\n\
          \  AIPES     Angle integrated photoemission spectroscopy\n  SPLEED    Spin\
          \ polarized LEED (experimental feature)\n  BAND      band structure calculations\
          \ (experimental feature)"
      IQ_AT_SURF:
        type:
          type_kind: string
        default: 1
      MILLER_HKL:
        type:
          type_kind: int
        shape:
        - 3
        repeated: true
        default:
        - 0
        - 0
        - 1
      CRYS_VEC:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: true
      STRVER:
        type:
          type_kind: int
        default: 1
      INPVER:
        type:
          type_kind: int
        default: 1
  SprkkrMarpesArpesSpecPh:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'SPEC_PH'
    quantities:
      THETA:
        type:
          type_kind: float
        default: 45.0
      PHI:
        type:
          type_kind: float
        default: 0.0
      POL_P:
        type:
          type_kind: string
        enum:
        - P
        - S
        - C+
        - C-
        default: P
      EPHOT:
        type:
          type_kind: float
        default: 25.0
      ALQ:
        type:
          type_kind: float
        default: 45.0
      DELQ:
        type:
          type_kind: float
        default: 0.0
      NPOL:
        type:
          type_kind: string
        enum:
        - '0'
        - '1'
        - '2'
        - '3'
        default: '1'
        description: "Possible values:\n  0         unpolarized and p-s dichroism\
          \ for the calculation\n  1         p-pol or rcp or elliptical (depends on\
          \ icirc, etc.)\n  2         s-pol or lcp or elliptical (depends on icirc,\
          \ etc.)\n  3         dichroism (ddad, ldad)"
      ICIRC:
        type:
          type_kind: string
        enum:
        - '0'
        - '1'
        - '2'
        default: '1'
        description: "Possible values:\n  0         elliptically pol. light: alq,\
          \ delq arbitrary\n  1         linear pol. light: alq arbitrary, delq=0\n\
          \  2         circular pol. light: alq=45, delq = 90"
      IDREH:
        type:
          type_kind: string
        enum:
        - '0'
        - '1'
        - '-1'
        default: '0'
        description: "Possible values:\n  0         linearly polarized (equals icirc=1)\n\
          \  1         right circular polarization\n  -1        left circular polarization"
      IFSP:
        type:
          type_kind: string
        enum:
        - '0'
        - '1'
        description: "Possible values:\n  0         fixed\n  1         variable"
      THETA_FIX:
        type:
          type_kind: float
  SprkkrMarpesArpesSpecEl:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'SPEC_EL'
    quantities:
      THETA:
        type:
          type_kind: float
        is_range: true
      PHI:
        type:
          type_kind: float
        is_range: true
      NT:
        type:
          type_kind: int
      NP:
        type:
          type_kind: int
      KA:
        type:
          type_kind: float
        is_range: true
      K1:
        type:
          type_kind: float
        is_range: true
      NK1:
        type:
          type_kind: int
      K2:
        type:
          type_kind: float
        is_range: true
      NK2:
        type:
          type_kind: int
      K3:
        type:
          type_kind: float
        is_range: true
      NK3:
        type:
          type_kind: int
      K4:
        type:
          type_kind: float
        is_range: true
      NK4:
        type:
          type_kind: int
      POL_E:
        type:
          type_kind: string
        enum:
        - PZ
        default: PZ
      SPOL:
        type:
          type_kind: int
      PSPIN:
        type:
          type_kind: float
        shape:
        - 3
        repeated: true
      BETA1:
        type:
          type_kind: float
      BETA2:
        type:
          type_kind: float
      ROTAXIS:
        type:
          type_kind: int
        shape:
        - 3
        repeated: true
      TYP:
        type:
          type_kind: string
        enum:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        default: '1'
        description: '3,4 only for angular resolved

          pe (ups, xps) note: nt=np-> nx,ny'
      ISTR:
        type:
          type_kind: int
        shape:
        - 2
        repeated: true
        default:
        - 0
        - 0
      POL0:
        type:
          type_kind: int
        shape:
        - 3
        repeated: true
        default:
        - 0
        - 0
        - 0
      POL0L:
        type:
          type_kind: int
        shape:
        - 3
        repeated: true
        default:
        - 0
        - 0
        - 0
      Q1:
        type:
          type_kind: string
        default: (1+0j)
      Q2:
        type:
          type_kind: string
        default: 0j
      Q3:
        type:
          type_kind: string
        default: 0j
      Q4:
        type:
          type_kind: string
        default: (1+0j)
  SprkkrMarpesArpesSpecStr:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'SPEC_STR'
    quantities:
      N_LAYDBL:
        type:
          type_kind: int
        repeated: true
        default:
        - 10
        - 10
      NLAT_G_VEC:
        type:
          type_kind: int
        default: 57
      N_LAYER:
        type:
          type_kind: int
        default: 50
      SURF_BAR:
        type:
          type_kind: float
        repeated: true
        default:
        - 0.25
        - 0.25
      TRANSP_BAR:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
  SprkkrMarpesArpes:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'arpes'
    quantities: {}
    sub_sections:
      CONTROL:
        section: SprkkrMarpesArpesControl
        repeats: false
      TAU:
        section: SprkkrMarpesArpesTau
        repeats: false
      ENERGY:
        section: SprkkrMarpesArpesEnergy
        repeats: false
      SITES:
        section: SprkkrMarpesArpesSites
        repeats: false
      TASK:
        section: SprkkrMarpesArpesTask
        repeats: false
      SPEC_PH:
        section: SprkkrMarpesArpesSpecPh
        repeats: false
      SPEC_EL:
        section: SprkkrMarpesArpesSpecEl
        repeats: false
      SPEC_STR:
        section: SprkkrMarpesArpesSpecStr
        repeats: false
