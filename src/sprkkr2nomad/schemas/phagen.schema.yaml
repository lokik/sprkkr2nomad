schema_package: sprkkr_phagen
sections:
  SprkkrPhagenPhagenControl:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'CONTROL'
    quantities:
      DATASET:
        type:
          type_kind: string
      ADSI:
        type:
          type_kind: string
        enum:
        - PHAGEN
        default: PHAGEN
      POTFIL:
        type:
          type_kind: string
      KRWS:
        type:
          type_kind: int
        min_value: 0
        max_value: 1
        default: 1
      KRMT:
        type:
          type_kind: string
        enum:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        description: "Possible values:\n  0         RMT is taken from the potential\
          \ file\n  1         RMT = min( x*RWS )\n  2         RMT = min( d_ij / 2\
          \ )\n  3         RMT from atomic charge density (=> KRWS=1)\n  4       \
          \  RMT from atomic Hartree potential (=> KRWS=1)\n  5         RMT from total\
          \ atomic potential (=> KRWS=1)\n  6         take average of 3 and 4 (=>\
          \ KRWS=1)"
      PRINT:
        type:
          type_kind: int
        min_value: 0
        max_value: 5
        default: 0
      NONMAG:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
      NOHFF:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
      NOSYM:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
  SprkkrPhagenPhagenTask:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'TASK'
    quantities:
      TASK:
        type:
          type_kind: string
        enum:
        - PHAGEN
        default: PHAGEN
  SprkkrPhagenPhagenTau:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'TAU'
    quantities:
      BZINT:
        type:
          type_kind: string
        enum:
        - POINTS
        - WEYL
        - CLUSTER
        description: 'The Weyl method (BZINT=WEYL) is a point sampling method using
          more or less ran-

          dom points. The number of k-points used for the integration varies quadratically
          be-

          tween 0.0 and ImE according to the imaginary part of the energy.


          The special point method (BZINT=POINTS) uses a regular k-point grid with
          NKTAB

          points. It is the standard method and gives a good compromise concerning
          accuracy

          and efficiency. For BZINT=POINTS the parameter NKTAB will be adjusted to
          allow a

          regular mesh.'
      NKTAB:
        type:
          type_kind: int
        default: 250
        description: For 2D problem, it serves only as default value for NKTABxD.
      NKTAB2D:
        type:
          type_kind: int
        description: If it is not specified, NKTAB is used.
      NKTAB3D:
        type:
          type_kind: int
        description: If it is not specified, NKTAB is used
      NKMIN:
        type:
          type_kind: int
        default: 300
      NKMAX:
        type:
          type_kind: int
        default: 500
      CLUSTER:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
        description: "Cluster type calculation calculate \u03C4 by inverting the real\
          \ space KKR matrix. Specify cluster center using IQCNTR or ITCNTR and its\
          \ size using NSHLCLU or CLURAD."
      NSHLCLU:
        type:
          type_kind: int
      CLURAD:
        type:
          type_kind: float
      IQCNTR:
        type:
          type_kind: string
      ITCNTR:
        type:
          type_kind: string
      NLOUT:
        type:
          type_kind: int
        default: 3
      MOL:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
      KKRMODE:
        type:
          type_kind: string
        enum:
        - STANDARD-KKR
        - TB-KKR
        - LAYER-KKR
  SprkkrPhagenPhagenEnergy:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'ENERGY'
    quantities:
      GRID:
        type:
          type_kind: int
        repeated: true
        default:
        - 5
        description: "0    only real energies -- Gauss integration mesh\n   1    only\
          \ real energies -- equidistant path\n   2    rectangular complex path\n\
          \   3    straight complex path parallel to real axis\n   4    rectangular\
          \ complex grid, return to real axis on log scale\n   5    arc in the complex\
          \ plain\n   6    standard X-ray mesh from E_Fermi to 3.5 Ry\n   7    X-ray\
          \ mesh\n   8    arc in the complex plane (logarithim)\n   9    arc in the\
          \ complex plane (Akai's scheme)\n  10    ellipse in the complex plain\n\
          \  11    semi circle (5) plus straight line (3)"
      NE:
        type:
          type_kind: int
        repeated: true
        default:
        - 32
      ImE:
        type:
          type_kind: float
        unit: Ry
        allowed_units:
        - Ry
        - eV
        default: 0.0
      EMIN:
        type:
          type_kind: float
      EMINEV:
        type:
          type_kind: float
  SprkkrPhagenPhagenScf:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'SCF'
    quantities:
      NITER:
        type:
          type_kind: int
        default: 200
      MIX:
        type:
          type_kind: float
        default: 0.2
      MIXOP:
        type:
          type_kind: float
      VXC:
        type:
          type_kind: string
        enum:
        - VWN
        - MJW
        - VBH
        - PBE
        - PW92
        - EV-GGA
        - BJ
        - MBJ
        default: VWN
        description: "Possible values:\n  VWN       Vosko, Wilk, Nusair (type: LDA,\
          \ libxc equivalent: LDA_C_VWN)\n  MJW       Janak, Williams, Moruzzigit\
          \ g (type: LDA, libxc equivalent: -)\n  VBH       von Barth, Hedin (type:\
          \ LDA, libxc equivalent: LDA_C_VBH)\n  PBE       Perdew, Burke, Ernzendorfer\
          \ GGA (type: GGA, libxc equivalent: GGA_X_PBE)\n  PW92      Perdew Wang\
          \ (type: GGA, libxc equivalent: GGA_X_PW91)\n  EV-GGA    Engel and Vosko\
          \ GGA (type: GGA, libxc equivalent: GGA_X_EV93)\n  BJ        Becke-Johnson\
          \ (type: metaGGA, libxc equivalent: MGGA_X_BJ06)\n  MBJ       modified Becke-Johnson\
          \ (type: metaGGA, libxc equivalent: MGGA_X_BJ06)"
      ALG:
        type:
          type_kind: string
        enum:
        - BROYDEN2
        - TCHEBY
        default: BROYDEN2
        description: "Possible values:\n  BROYDEN2  Broyden\u2019s second method\n\
          \  TCHEBY    Tchebychev"
      EFGUESS:
        type:
          type_kind: float
      TOL:
        type:
          type_kind: float
        default: 1.0e-05
      ISTBRY:
        type:
          type_kind: int
        default: 1
      FULLPOT:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
      ITDEPT:
        type:
          type_kind: int
        default: 40
      QION:
        type:
          type_kind: float
        repeated: true
      QIONSCL:
        type:
          type_kind: float
      MSPIN:
        type:
          type_kind: float
        repeated: true
      USEVMATT:
        type:
          type_kind: bool
        optional: true
        default_if_missing: true
        default: false
  SprkkrPhagenPhagen:
    base_section: nomad.datamodel.metainfo.basesections.EntryData
    description: Auto-generated SPRKKR section 'phagen'
    quantities: {}
    sub_sections:
      CONTROL:
        section: SprkkrPhagenPhagenControl
        repeats: false
      TASK:
        section: SprkkrPhagenPhagenTask
        repeats: false
      TAU:
        section: SprkkrPhagenPhagenTau
        repeats: false
      ENERGY:
        section: SprkkrPhagenPhagenEnergy
        repeats: false
      SCF:
        section: SprkkrPhagenPhagenScf
        repeats: false
